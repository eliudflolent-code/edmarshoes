<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Admin - EdmarShoes</title>
    <style>
        body { background: #000; color: white; padding: 20px; font-family: sans-serif; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 10px; border: none; }
        button { background: #25D366; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Settings (Promo 4 + Background)</h3>
        <input type="text" id="bg" placeholder="URL ya Background Image">
        <input type="text" id="mq" placeholder="Maneno ya Marquee">
        <input type="text" id="p1" placeholder="Promo 1">
        <input type="text" id="p2" placeholder="Promo 2">
        <input type="text" id="p3" placeholder="Promo 3">
        <input type="text" id="p4" placeholder="Promo 4">
        <button onclick="saveSettings()">Hifadhi Settings</button>
    </div>
    <script>
        async function saveSettings() {
            const d = {
                bgImage:document.getElementById('bg').value, 
                marquee:document.getElementById('mq').value, 
                promo1:document.getElementById('p1').value, 
                promo2:document.getElementById('p2').value, 
                promo3:document.getElementById('p3').value,
                promo4:document.getElementById('p4').value
            };
            await fetch('/api/admin/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)});
            alert('Settings zimehifadhiwa!');
        }
    </script>
</body>
</html>
