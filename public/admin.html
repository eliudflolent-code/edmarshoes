<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Edmar Admin - Control Panel</title>
    <style>
        body { background: #000; color: white; padding: 20px; font-family: sans-serif; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 10px; border: none; }
        button { background: #25D366; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Box 1: Hero Slider (Picha 5)</h3>
        <input type="text" id="slideUrl" placeholder="Paste Direct Link ya Picha">
        <button onclick="addSlide()">Ongeza kwenye Slider</button>
    </div>
    <div class="box">
        <h3>Box 2: Marquee na Promo</h3>
        <input type="text" id="marquee" placeholder="Maneno ya Marquee">
        <input type="text" id="p1" placeholder="Promo 1">
        <input type="text" id="p2" placeholder="Promo 2">
        <input type="text" id="p3" placeholder="Promo 3">
        <button onclick="saveSettings()">Hifadhi Settings</button>
    </div>
    <div class="box">
        <h3>Box 3: Bidhaa (Main)</h3>
        <input type="text" id="name" placeholder="Jina la Kiatu">
        <input type="text" id="price" placeholder="Bei">
        <input type="text" id="url" placeholder="Direct Link ya Picha">
        <button onclick="addProduct()">Ongeza Kiatu</button>
    </div>
    <script>
        async function saveSettings() {
            const data = { marquee: document.getElementById('marquee').value, promo1: document.getElementById('p1').value, promo2: document.getElementById('p2').value, promo3: document.getElementById('p3').value };
            await fetch('/api/admin/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
            alert('Settings zimehifadhiwa!');
        }
        async function addProduct() {
            const p = { name: document.getElementById('name').value, price: document.getElementById('price').value, imageUrl: document.getElementById('url').value };
            await fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) });
            alert('Kiatu kimeingia dukani!');
        }
    </script>
</body>
</html>
