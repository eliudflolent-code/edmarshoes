<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #111; padding: 25px; border-radius: 30px; max-width: 500px; margin: auto; border: 1px solid #444; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 15px; border: none; box-sizing: border-box; }
        button { background: #25D366; padding: 12px; border-radius: 15px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
        .logout { background: #ff3b30; color: white; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin Dashboard</h2>
        <input type="text" id="name" placeholder="Jina la kiatu">
        <input type="text" id="price" placeholder="Bei">
        <textarea id="desc" placeholder="Maelezo"></textarea>
        <input type="text" id="url" placeholder="Direct Link ya Picha">
        <button onclick="add()">Hifadhi Bidhaa</button>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
    <script>
        async function add() {
            const p = { name: document.getElementById('name').value, price: document.getElementById('price').value, description: document.getElementById('desc').value, imageUrl: document.getElementById('url').value };
            await fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) });
            alert('Imepanda!'); location.reload();
        }
        async function logout() { await fetch('/api/admin/logout'); location.href='/'; }
    </script>
</body>
</html>
