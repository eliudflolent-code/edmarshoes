<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAR ADMIN - Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { border-bottom: 3px solid #25D366; padding-bottom: 10px; color: #111; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { background: #25D366; color: black; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; transition: 0.2s; }
        button:hover { background: #1ebd51; }
        .product-list { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .item-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .del-btn { background: #ff3b30; color: white; width: auto; padding: 6px 12px; font-size: 0.9rem; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>EDMAR SHOES - Dashboard 🔧</h2>
    
    <form id="uploadForm">
        <div class="form-group">
            <label>Jina la Kiatu:</label>
            <input type="text" name="name" id="pName" placeholder="Mfano: Jordan 4 Kali" required>
        </div>
        
        <div class="form-group">
            <label>Bei ya Kiatu (Tsh):</label>
            <input type="text" name="price" id="pPrice" placeholder="Mfano: 55,000">
        </div>
        
        <div class="form-group">
            <label>Maelezo Mafupi (Description):</label>
            <textarea name="description" id="pDesc" rows="2" placeholder="Sifa za kiatu hiki..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Chagua Picha ya Kiatu (Kutoka Kwenye Faili):</label>
            <input type="file" name="image" id="pImage" accept="image/*" required>
        </div>
        
        <button type="submit">Pandisha Bidhaa Mpya Moja kwa Moja 🚀</button>
    </form>

    <div class="product-list">
        <h3>Viatu Vilivyopo Dukani</h3>
        <div id="orodhaKuu">Inapakia viatu...</div>
    </div>
</div>

<script>
    const form = document.getElementById('uploadForm');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const name = document.getElementById('pName').value.trim();
        const fileInput = document.getElementById('pImage');

        if (!name || fileInput.files.length === 0) {
            alert('Tafadhali jaza Jina la kiatu na Uchague Picha!');
            return;
        }

        // Tunatumia FormData kama ulivyokuwa unatumia mwanzo kufanikisha picha kupanda
        const formData = new FormData(form);

        try {
            const response = await fetch('/api/products', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.success) {
                alert('Hongera sana kaka! Mzigo mpya wa kiatu umepanda kwenye duka lako! 🎉');
                form.reset();
                pakiaViatuVyetu();
            } else {
                alert('Server imegoma: ' + (data.error || 'Shida haijulikani'));
            }
        } catch (error) {
            alert('Kosa la Mawasiliano: Kushindwa kabisa kufika kwenye server!');
        }
    });

    async function pakiaViatuVyetu() {
        try {
            const res = await fetch('/api/products');
            const viatu = await res.json();
            const div = document.getElementById('orodhaKuu');
            
            if(viatu.length === 0) {
                div.innerHTML = '<p style="color:#999">Bado duka lipo tupu. Pandisha viatu juu!</p>';
                return;
            }

            div.innerHTML = viatu.map(v => `
                <div class="item-row">
                    <img src="${v.imageUrl}">
                    <div>
                        <strong>${v.name}</strong><br>
                        <small style="color:#777">Tsh ${v.price}/=</small>
                    </div>
                    <button class="del-btn" onclick="futaKiatu('${v.id}')">Futa</button>
                </div>
            `).join('');
        } catch(e) {
            document.getElementById('orodhaKuu').innerText = 'Imefeli kupakia orodha.';
        }
    }

    async function futaKiatu(id) {
        if (confirm('Je, una uhakika unataka kufuta kabisa kiatu hiki dukani?')) {
            const res = await fetch('/api/products/' + id, { method: 'DELETE' });
            if(res.ok) {
                alert('Kiatu kimefutwa!');
                pakiaViatuVyetu();
            }
        }
    }

    pakiaViatuVyetu();
</script>
</body>
</html>
