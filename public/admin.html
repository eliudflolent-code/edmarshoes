<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAR - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .admin-box { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 25px; color: #111; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #25D366; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background: #21b855; }
        .logout-btn { background: #ff4d4d; margin-top: 10px; }
        .logout-btn:hover { background: #e60000; }
    </style>
</head>
<body>
<div class="admin-box">
    <h2>EDMAR Control Panel 🛠️</h2>
    
    <form action="/api/products" method="POST">
        <label>Jina la Kiatu:</label>
        <input type="text" name="title" required placeholder="Mfano: Nike Air Force 1">
        
        <label>Link ya Picha (Direct Link):</label>
        <input type="url" name="imageUrl" required placeholder="https://images.unsplash.com/...">
        
        <label>Bei (Tsh):</label>
        <input type="text" name="price" required placeholder="Mfano: 45,000">
        
        <label>Maelezo ya Kiatu:</label>
        <textarea name="description" rows="3" required placeholder="Weka saizi zilizopo..."></textarea>
        
        <button type="submit">Upload Bidhaa Mpya 🎉</button>
    </form>

    <hr style="margin:30px 0; border:0; border-top:1px solid #eee;">
    
    <form action="/api/settings" method="POST">
        <input type="hidden" name="key" value="marquee_text">
        <label>Badilisha Tangazo Linalotembea (Marquee):</label>
        <input type="text" name="value" required placeholder="Weka tangazo jipya hapa...">
        <button type="submit" style="background:#3498db;">Update Tangazo 📢</button>
    </form>

    <a href="/api/admin/logout"><button class="logout-btn">Ondoka Kwenye Mfumo (Logout) 🚪</button></a>
</div>
</body>
</html>
