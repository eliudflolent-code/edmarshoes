<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAR SHOES - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #222; padding: 40px; border-radius: 15px; border: 2px solid #25D366; box-shadow: 0 4px 20px rgba(37, 211, 102, 0.2); text-align: center; width: 100%; max-width: 360px; color: white; }
        h2 { margin-bottom: 20px; font-size: 1.8rem; }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #444; background: #333; color: white; border-radius: 8px; box-sizing: border-box; font-size: 1rem; text-align: center; }
        input:focus { border-color: #25D366; outline: none; }
        button { width: 100%; background: #25D366; color: black; border: none; padding: 12px; margin-top: 20px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1ebd51; transform: scale(1.02); }
        .err { color: #ff3b30; margin-top: 10px; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>EDMAR ADMIN 🔐</h2>
        <input type="password" id="passInput" placeholder="Weka Password ya Siri">
        <div class="err" id="errorMsg">Password sio sahihi!</div>
        <button onclick="jaribuLogin()">Ingia Kazini 🚀</button>
    </div>
    <script>
        async function jaribuLogin() {
            const password = document.getElementById('passInput').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password })
            });
            if (res.ok) {
                window.location.href = '/admin.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
