<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAR - Admin Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
        h2 { margin-bottom: 20px; color: #111; }
        h2 span { color: #25D366; }
        input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; text-align: center; }
        button { width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background: #21b855; }
        .back-link { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #25D366; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>EDMAR<span>ADMIN</span></h2>
        <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">Weka password yako kuu kuingia kwenye mfumo</p>
        
        <form action="/api/admin/login" method="POST">
            <input type="password" name="password" required placeholder="••••••••" autofocus>
            <button type="submit">Ingia Kazini 🔐</button>
        </form>

        <a href="/index.html" class="back-link">← Rudi Kwenye Duka</a>
    </div>

</body>
</html>
