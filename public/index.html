<!DOCTYPE html>
<html>
<head>
    <style id="bgStyle"></style>
    <style>
        .box { background: rgba(0,0,0,0.7); border-radius: 20px; padding: 20px; margin: 10px; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        async function load() {
            const [s, sl, p] = await Promise.all([fetch('/api/settings').then(r=>r.json()), fetch('/api/slides').then(r=>r.json()), fetch('/api/products').then(r=>r.json())]);
            document.getElementById('bgStyle').innerHTML = `body { background: url('${s.bgImage}') fixed center; }`;
            document.getElementById('content').innerHTML = `
                <div class="box"><marquee>${s.marquee || ''}</marquee></div>
                <div class="box">
                    <div class="grid">${sl.map(i=>`<img src="${i.imageUrl}" style="width:100px; border-radius:10px">`).join('')}</div>
                    <h3>Promo: ${s.promo1 || ''} | ${s.promo2 || ''} | ${s.promo3 || ''}</h3>
                </div>
                <div class="box grid">${p.map(i=>`<div onclick="window.open('${i.imageUrl}')"><img src="${i.imageUrl}" style="width:100%; border-radius:20px"><h3>${i.name}</h3><a href="https://wa.me/255653434685">Agiza WhatsApp 💬</a></div>`).join('')}</div>
            `;
        }
        load();
    </script>
</body>
</html>
