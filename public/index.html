<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMARSHOES</title>
    <style id="bgStyle"></style>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; color: white; background-attachment: fixed; background-size: cover; }
        
        .header { position: sticky; top: 0; z-index: 1000; background: rgba(0,0,0,0.95); padding: 10px; border-bottom: 3px solid #25D366; text-align: center; }
        .brand-name { font-size: 1.5rem; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .nav { display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; }
        .nav a { color: white; text-decoration: none; font-weight: bold; }
        
        .container { max-width: 100%; padding: 10px; }
        .box { background: rgba(0,0,0,0.7); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #444; }
        
        .slider-box { height: 200px; position: relative; overflow: hidden; border-radius: 15px; border: 2px solid #25D366; }
        .slider-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 1s ease-in-out; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        
        /* HOVER EFFECT IMEARUDI HAPA */
        .card { background: #1a1a1a; border-radius: 15px; padding: 10px; text-align: center; border: 1px solid #333; transition: 0.3s ease; }
        .card:hover { transform: translateY(-8px); border-color: #25D366; box-shadow: 0 8px 15px rgba(37, 211, 102, 0.4); }
        
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
        .card h3 { font-size: 1rem; margin: 10px 0; }
        
        .whatsapp-btn { display: block; background: #25D366; color: black; padding: 8px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.8rem; }
        footer { text-align: center; padding: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <marquee style="color:#25D366; font-weight:bold; font-size:0.8rem" id="marqueeText"></marquee>
        <div class="brand-name">EDMARSHOES</div>
        <div class="nav"><a href="/">HOME</a><a href="#why-us">WHY US</a><a href="#shop">BIDHAA</a></div>
    </div>

    <div class="container">
        <div class="slider-box" id="slideList"></div>
        <div class="grid" id="promoList" style="margin-top:15px"></div>
        <div class="box" id="shop" style="margin-top:15px">
            <div class="grid" id="productList"></div>
        </div>
    </div>
    <footer>&copy; 2026 EDMARSHOES</footer>

    <script>
        async function init() {
            const [s, sl, p] = await Promise.all([fetch('/api/settings').then(r=>r.json()), fetch('/api/slides').then(r=>r.json()), fetch('/api/products').then(r=>r.json())]);
            document.getElementById('bgStyle').innerHTML = `body { background: url('${s.bgImage || 'https://i.postimg.cc/bg-image.jpg'}') center/cover; }`;
            document.getElementById('marqueeText').innerText = s.marquee || 'KARIBU EDMARSHOES';
            document.getElementById('promoList').innerHTML = [s.promo1, s.promo2, s.promo3].map(t => `<div class="card"><h3>${t || 'Promo'}</h3></div>`).join('');
            
            const slideContainer = document.getElementById('slideList');
            slideContainer.innerHTML = sl.map((i, idx) => `<img src="${i.imageUrl}" style="${idx==0?'opacity:1':''}">`).join('');
            let current = 0;
            const imgs = slideContainer.getElementsByTagName('img');
            if(imgs.length > 0) {
                setInterval(() => {
                    imgs[current].style.opacity = 0;
                    current = (current + 1) % imgs.length;
                    imgs[current].style.opacity = 1;
                }, 3000);
            }

            document.getElementById('productList').innerHTML = p.map(i => `
                <div class="card">
                    <img src="${i.imageUrl}">
                    <h3>${i.name}</h3>
                    <p style="font-size:0.9rem">Tsh ${i.price}</p>
                    <a href="https://wa.me/255653434685?text=Nataka ${i.name}" class="whatsapp-btn">Agiza WhatsApp</a>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
