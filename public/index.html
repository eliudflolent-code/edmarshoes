<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>EDMARSHOES</title>
    <style id="bgStyle"></style>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; color: white; background-attachment: fixed; background-size: cover; }
        .header { background: rgba(0,0,0,0.9); padding: 20px; border-bottom: 3px solid #25D366; text-align: center; }
        .nav { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .nav a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .box { background: rgba(0,0,0,0.7); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid #444; }
        
        /* Slideshow */
        .slider-box { height: 300px; position: relative; overflow: hidden; border-radius: 20px; border: 2px solid #25D366; }
        .slider-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 1s ease-in-out; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #1a1a1a; border-radius: 25px; padding: 15px; text-align: center; border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); border-color: #25D366; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 20px; cursor: pointer; }
        
        .whatsapp-btn { display: block; background: #25D366; color: black; padding: 10px; border-radius: 15px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        footer { text-align: center; padding: 30px; background: rgba(0,0,0,0.8); border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <marquee style="color:#25D366; font-weight:bold" id="marqueeText"></marquee>
        <div class="nav"><a href="/">HOME</a><a href="#why-us">WHY US</a><a href="#shop">BIDHAA</a></div>
    </div>
    <div class="container">
        <div class="slider-box" id="slideList"></div>
        <div class="grid" id="promoList" style="margin-top:20px"></div>
        <div class="box" id="shop" style="margin-top:20px">
            <div class="grid" id="productList"></div>
        </div>
    </div>
    <footer>&copy; 2026 EDMARSHOES</footer>
    <script>
        async function init() {
            const [s, sl, p] = await Promise.all([fetch('/api/settings').then(r=>r.json()), fetch('/api/slides').then(r=>r.json()), fetch('/api/products').then(r=>r.json())]);
            document.getElementById('bgStyle').innerHTML = `body { background: url('${s.bgImage || 'https://i.postimg.cc/bg-image.jpg'}') center/cover; }`;
            document.getElementById('marqueeText').innerText = s.marquee || 'KARIBU EDMARSHOES';
            document.getElementById('promoList').innerHTML = [s.promo1, s.promo2, s.promo3].map(t => `<div class="card"><h3>${t || 'Promo'}</h3></div>`).join('');
            
            // Slider Logic
            const slideContainer = document.getElementById('slideList');
            slideContainer.innerHTML = sl.map((i, idx) => `<img src="${i.imageUrl}" style="${idx==0?'opacity:1':''}">`).join('');
            let current = 0;
            const imgs = slideContainer.getElementsByTagName('img');
            setInterval(() => {
                imgs[current].style.opacity = 0;
                current = (current + 1) % imgs.length;
                imgs[current].style.opacity = 1;
            }, 3000);

            document.getElementById('productList').innerHTML = p.map(i => `
                <div class="card">
                    <img src="${i.imageUrl}" onclick="window.open('${i.imageUrl}')">
                    <h3>${i.name}</h3>
                    <p>Tsh ${i.price}</p>
                    <a href="https://wa.me/255653434685?text=Nataka ${i.name}" class="whatsapp-btn">Agiza WhatsApp 💬</a>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
