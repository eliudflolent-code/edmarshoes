<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMAR SHOES - Duka la Viatu Vikali</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: white; margin: 0; padding: 0; }
        .header { background: #222; padding: 20px; text-align: center; border-bottom: 3px solid #25D366; }
        .header h1 { margin: 0; color: #25D366; font-size: 2.5rem; }
        .header p { margin: 5px 0 0 0; color: #aaa; font-style: italic; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #222; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #25D366; }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card-body { padding: 20px; text-align: center; }
        .card-body h3 { margin: 0 0 10px 0; font-size: 1.4rem; color: #fff; }
        .card-body p { margin: 0 0 15px 0; color: #aaa; font-size: 0.9rem; height: 40px; overflow: hidden; }
        .price { font-size: 1.3rem; font-weight: bold; color: #25D366; margin-bottom: 15px; }
        .btn-whatsapp { display: inline-block; background: #25D366; color: black; text-decoration: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; width: 80%; transition: 0.2s; }
        .btn-whatsapp:hover { background: #1ebd51; }
        .footer { background: #111; text-align: center; padding: 40px 20px; color: #555; font-size: 0.85rem; margin-top: 50px; }
        .footer a { color: #333; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>EDMAR SHOES 👟</h1>
        <p>EDMARSHOES YOUR FEET, OUR FATE</p>
    </div>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 30px; font-weight: 400;">Viatu Vilivyopo Dukani Sasa Hivi</h2>
        <div class="grid" id="dukaKuu">
            <p style="text-align: center; grid-column: 1/-1; color: #777;">Inapakia bidhaa...</p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 EDMARSHOES. Haki zote zimehifadhiwa.</p>
        <a href="/login.html">🔒 Mfumo wa Admin</a>
    </div>

    <script>
        async function pakiaViatuDukani() {
            try {
                const res = await fetch('/api/products');
                const viatu = await res.json();
                const grid = document.getElementById('dukaKuu');
                
                if (viatu.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #aaa;">Bado hakuna bidhaa zilizopandishwa dukani.</p>';
                    return;
                }

                grid.innerHTML = viatu.map(v => {
                    // Kutengeneza ujumbe wa WhatsApp kwa ajili ya kuagiza
                    const ujumbe = encodeURIComponent(`Habari EDMAR SHOES, nataka kuagiza kiatu hiki:\n\nJina: ${v.name}\nBei: Tsh ${v.price}/=`);
                    // Namba yako ya WhatsApp ya biashara
                    const whatsappLink = `https://wa.me/255653434685?text=${ujumbe}`;

                    return `
                        <div class="card">
                            <img src="${v.imageUrl}" onerror="this.src='/uploads/default.jpg'">
                            <div class="card-body">
                                <h3>${v.name}</h3>
                                <p>${v.description || 'Kiatu kikali na cha kisasa.'}</p>
                                <div class="price">Tsh ${v.price}/=</div>
                                <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">Agiza kwa WhatsApp 💬</a>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('dukaKuu').innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #ff3b30;">Imefeli kupakia viatu kutoka kwenye server.</p>';
            }
        }

        // Washa duka pindi mteja anapofungua website
        pakiaViatuDukani();
    </script>
</body>
</html>
