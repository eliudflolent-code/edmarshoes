<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMARSHOES | Duka la Viatu</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; background-image: url('https://i.postimg.cc/bg-image.jpg'); background-size: cover; background-attachment: fixed; }
        .header { background: rgba(0,0,0,0.9); padding: 15px; border-bottom: 2px solid #25D366; }
        .marquee { color: #25D366; font-weight: bold; margin-bottom: 10px; }
        .nav { display: flex; gap: 20px; justify-content: center; }
        .nav a { color: white; text-decoration: none; font-weight: bold; padding: 10px; border-radius: 15px; }
        .nav a:hover { background: #25D366; color: black; }
        .box { background: rgba(0,0,0,0.7); border-radius: 30px; padding: 25px; margin: 20px auto; max-width: 1000px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #111; border-radius: 25px; overflow: hidden; transition: 0.3s; border: 1px solid #444; }
        .product-card:hover { transform: scale(1.03); border-color: #25D366; }
        .product-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 25px 25px 0 0; cursor: pointer; }
        .btn-wa { display: block; background: #25D366; color: black; text-align: center; padding: 12px; margin: 15px; border-radius: 15px; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <marquee class="marquee">KARIBU EDMARSHOES - TUNALETA VIATU VYA KISASA KWA BEI SAFI!</marquee>
        <div class="nav">
            <a href="/">Home</a>
            <a href="#why-us">Why Us</a>
            <a href="#shop">Bidhaa</a>
        </div>
    </div>
    <div class="box"><h1>EDMARSHOES YOUR FEET, OUR FATE</h1></div>
    <div class="box" id="why-us">
        <div class="grid">
            <div style="text-align:center"><h3>🚀 Delivery Haraka</h3></div>
            <div style="text-align:center"><h3>💎 Ubora Og</h3></div>
            <div style="text-align:center"><h3>💰 Bei Nafuu</h3></div>
        </div>
    </div>
    <div class="box" id="shop">
        <div class="grid" id="product-list"></div>
    </div>
    <script>
        async function load() {
            const res = await fetch('/api/products');
            const data = await res.json();
            document.getElementById('product-list').innerHTML = data.map(p => `
                <div class="product-card">
                    <img src="${p.imageUrl}" onclick="window.open('${p.imageUrl}')">
                    <div style="padding:15px"><h3>${p.name}</h3><p>Tsh ${p.price}</p>
                    <a href="https://wa.me/255653434685?text=Nataka ${p.name}" class="btn-wa">Agiza WhatsApp</a></div>
                </div>
            `).join('');
        }
        load();
    </script>
</body>
</html>
