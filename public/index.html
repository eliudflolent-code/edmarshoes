<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDMARSHOES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style id="bgStyle"></style>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; color: white; background-attachment: fixed; background-size: cover; }
        .header { position: sticky; top: 0; z-index: 1000; background: rgba(0,0,0,0.95); padding: 10px; border-bottom: 3px solid #25D366; text-align: center; }
        .brand-name { font-size: 1.5rem; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .nav { display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; }
        .nav a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 100%; padding: 10px; }
        .box { background: rgba(0,0,0,0.7); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #444; }
        .slider-box { height: 200px; position: relative; overflow: hidden; border-radius: 15px; border: 2px solid #25D366; }
        .slider-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 1s ease-in-out; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .card { background: #1a1a1a; border-radius: 15px; padding: 10px; text-align: center; transition: 0.3s; border: 1px solid #333; }
        .card:hover { transform: translateY(-8px); border: 1px solid #25D366; }
        .card img { width: 100%; height: 150px; object-fit: contain; background: #000; border-radius: 10px; cursor: pointer; }
        .whatsapp-btn { display: block; background: #25D366; color: black; padding: 8px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.8rem; margin-top:10px; }
        footer { text-align: center; padding: 20px; background: rgba(0,0,0,0.9); margin-top: 20px; border-top: 2px solid #333; }
        .footer-icons a { color: #fff; font-size: 24px; margin: 0 15px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <marquee id="marqueeText" style="color:#25D366; font-weight:bold"></marquee>
        <div class="brand-name">EDMARSHOES</div>
        <div class="nav"><a href="/">HOME</a><a href="#why-us">WHY US</a><a href="#shop">BIDHAA</a></div>
    </div>
    <div class="container">
        <div class="slider-box" id="slideList"></div>
        <div id="promoList" class="grid" style="margin-top:15px"></div>
        <div class="box" id="shop" style="margin-top:15px">
            <div id="productList" class="grid"></div>
        </div>
    </div>
    <footer>
        <div class="footer-icons">
            <a href="https://wa.me/255616807103" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="mailto:edwardedmar@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <p style="font-size:0.8rem; margin-top:10px;">&copy; 2026 EDMARSHOES</p>
    </footer>
    <script>
        fetch('/api/data').then(r=>r.json()).then(d => {
            document.getElementById('bgStyle').innerHTML = `body { background: url('${d.settings.bgImage}') center/cover; }`;
            document.getElementById('marqueeText').innerText = d.settings.marquee;
            document.getElementById('promoList').innerHTML = [d.settings.promo1, d.settings.promo2, d.settings.promo3, d.settings.promo4].map(t => `<div class="card"><h3>${t || ''}</h3></div>`).join('');
            
            const slideContainer = document.getElementById('slideList');
            slideContainer.innerHTML = d.slides.map((i, idx) => `<img src="${i.imageUrl}" style="${idx==0?'opacity:1':''}">`).join('');
            let current = 0;
            const imgs = slideContainer.getElementsByTagName('img');
            setInterval(() => { if(imgs.length > 0) { imgs[current].style.opacity = 0; current = (current + 1) % imgs.length; imgs[current].style.opacity = 1; } }, 3000);

            document.getElementById('productList').innerHTML = d.products.map(p => `
                <div class="card">
                    <img src="${p.imageUrl}" onclick="window.open('${p.imageUrl}')">
                    <h3>${p.name}</h3>
                    <p style="font-size:0.9rem">Tsh ${p.price}</p>
                    <a href="https://wa.me/255616807103?text=Nataka ${p.name}" class="whatsapp-btn">Agiza</a>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
